<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" shape-rendering="crispEdges">
  <title>SegFault</title>
  <!-- "Overrun": an allocated region with one module bitten out of its top-right
       corner, and that exact module sitting outside the boundary. The vacated
       slot carries the accent — the fault address.

       All coordinates are even on the 32-unit grid, so this rasterises with zero
       partial coverage at 16 and 32. Ink ground rather than transparency: the
       mark is bone-dominant and #EDE7E0 on a light tab strip is ~1.2:1. -->
  <rect width="32" height="32" fill="#141110" />

  <!-- the boundary the escapee crossed, continued past the block as hairlines at
       10%. Sub-pixel and invisible at tab size; it does its work at 48px+, where
       it separates the mark from a generic crop handle. -->
  <g fill="#EDE7E0" opacity="0.1">
    <rect x="20" y="11" width="12" height="1" />
    <rect x="19" y="0" width="1" height="12" />
  </g>

  <rect x="2" y="12" width="18" height="18" fill="#EDE7E0" />
  <rect x="14" y="12" width="6" height="6" fill="#4E03FF" />
  <rect x="24" y="2" width="6" height="6" fill="#EDE7E0" />
</svg>
